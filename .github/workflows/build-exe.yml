name: Build Windows exe

on:
  workflow_dispatch:  # 手动触发

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build exe
        run: |
          pyinstaller --onefile --name convert --hidden-import=src --hidden-import=src.main --hidden-import=src.decryptor --hidden-import=src.converter --hidden-import=src.resource_handler app.py

      - name: Prepare distribution
        run: |
          mkdir package
          copy dist\convert.exe package\
          mkdir package\input
          mkdir package\output

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: yinxiang-converter-windows
          path: package/
