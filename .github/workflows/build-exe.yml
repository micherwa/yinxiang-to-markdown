name: 打包 Windows exe

on:
  workflow_dispatch:  # 手动触发

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build exe
        run: |
          pyinstaller --onefile --name 转换 --hidden-import=src --hidden-import=src.main --hidden-import=src.decryptor --hidden-import=src.converter --hidden-import=src.resource_handler app.py

      - name: Prepare distribution
        run: |
          mkdir dist\印象笔记转换工具
          copy dist\转换.exe dist\印象笔记转换工具\
          mkdir dist\印象笔记转换工具\input
          mkdir dist\印象笔记转换工具\output

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 印象笔记转换工具-windows
          path: dist/印象笔记转换工具/
